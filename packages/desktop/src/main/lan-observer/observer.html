<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>Percho LAN Observer</title>
<style>
:root{color-scheme:light dark;--bg:#fafafa;--card:#fff;--ink:#18181b;--muted:#71717a;--line:#e4e4e7;--warn:#b91c1c;--ok:#15803d}@media(prefers-color-scheme:dark){:root{--bg:#17171a;--card:#222226;--ink:#f4f4f5;--muted:#a1a1aa;--line:#3f3f46;--warn:#fca5a5;--ok:#86efac}}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}header{position:sticky;top:0;padding:16px;background:color-mix(in srgb,var(--bg) 92%,transparent);border-bottom:1px solid var(--line);backdrop-filter:blur(8px);z-index:1}h1{font-size:16px;margin:0}.state{font-size:12px;color:var(--muted);margin-top:4px}.wrap{max-width:900px;margin:auto;padding:14px;display:grid;gap:14px;grid-template-columns:minmax(170px,260px) minmax(0,1fr)}.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px}.list button,.history{width:100%;border:0;border-radius:8px;background:transparent;color:var(--ink);text-align:left;padding:9px}.list button{cursor:pointer}.history{opacity:.5}.list button.active,.list button:hover{background:color-mix(in srgb,var(--line) 55%,transparent)}.name{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.path,.meta{font-size:11px;color:var(--muted);margin-top:3px;overflow:hidden;text-overflow:ellipsis}.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--muted);margin-right:5px}.dot.live{background:var(--ok)}.banner{color:var(--warn);border:1px solid var(--warn);background:color-mix(in srgb,var(--warn) 9%,transparent);border-radius:8px;padding:10px;font-weight:600;margin-bottom:10px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.label{font-size:11px;color:var(--muted)}.value{margin-top:2px;word-break:break-word}pre{white-space:pre-wrap;word-break:break-word;background:color-mix(in srgb,var(--bg) 70%,var(--card));border-radius:8px;padding:10px;max-height:280px;overflow:auto;font:12px ui-monospace,SFMono-Regular,Menlo,monospace}.todo{padding:6px 0;border-bottom:1px solid var(--line)}.todo:last-child{border:0}.done{text-decoration:line-through;color:var(--muted)}.empty{color:var(--muted);padding:18px 4px}.token{max-width:360px;margin:12vh auto}.token input{width:100%;padding:10px;margin:8px 0;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink)}.token button{padding:9px 12px;border:0;border-radius:8px;background:var(--ink);color:var(--bg)}@media(max-width:620px){.wrap{grid-template-columns:1fr}.list{max-height:190px;overflow:auto}.grid{grid-template-columns:1fr}}
</style>
</head>
<body><header><h1>Percho LAN Observer</h1><div id="state" class="state"></div></header><main id="app"></main>
<script>
(() => {
const zh=navigator.language.toLowerCase().startsWith("zh");const L=zh?{connecting:"连接中…",connected:"已连接",reconnecting:"重连中…",token:"输入访问令牌",open:"打开观察页",empty:"暂无活跃会话",working:"工作中",idle:"空闲",compacting:"压缩中",queued:"有排队消息",tool:"当前工具",todos:"任务",output:"助手输出",stats:"用量",error:"错误",project:"项目",permission:"等待桌面端批准",noOutput:"暂无输出",input:"输入 tokens",outputTokens:"输出 tokens",cost:"费用"}:{connecting:"Connecting…",connected:"Connected",reconnecting:"Reconnecting…",token:"Enter access token",open:"Open observer",empty:"No active sessions",working:"Working",idle:"Idle",compacting:"Compacting",queued:"Queued messages",tool:"Current tool",todos:"Todos",output:"Assistant output",stats:"Usage",error:"Error",project:"Project",permission:"Waiting for desktop approval",noOutput:"No output yet",input:"Input tokens",outputTokens:"Output tokens",cost:"Cost"};
let token=new URLSearchParams(location.search).get("t")||localStorage.getItem("percho-lan-token")||"";let list=[],views=new Map(),selected="",stream;
const app=document.querySelector("#app"),state=document.querySelector("#state");const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));
function setState(s){state.textContent=s}function request(){return fetch(`/api/snapshot?t=${encodeURIComponent(token)}`,{cache:"no-store"}).then(r=>{if(!r.ok){const error=Error();error.status=r.status;throw error}return r.json()})}
function snapshot(data){list=data.list||[];views=new Map((data.views||[]).map(v=>[v.sessionId,v]));if(!selected||!views.has(selected))selected=(data.views||[])[0]?.sessionId||"";render()}
function invalidToken(){stream?.close();localStorage.removeItem("percho-lan-token");token="";renderToken()}function handleRequestError(error){if(error?.status===401)invalidToken();else renderToken()}
function connect(){if(!token){renderToken();return}setState(L.connecting);request().then(snapshot).catch(handleRequestError);stream?.close();stream=new EventSource(`/api/stream?t=${encodeURIComponent(token)}`);stream.onopen=()=>{setState(L.connected);request().then(snapshot).catch(handleRequestError)};stream.onerror=()=>{setState(L.reconnecting);request().catch(error=>{if(error?.status===401)invalidToken()})};stream.addEventListener("view",e=>{const d=JSON.parse(e.data);views.set(d.sessionId,d.view);if(!selected)selected=d.sessionId;render()});stream.addEventListener("list",e=>{list=JSON.parse(e.data).list||[];render()})}
function renderToken(){app.innerHTML=`<section class="card token"><strong>${L.token}</strong><input id="token" type="password" autocomplete="off"><button id="open">${L.open}</button></section>`;document.querySelector("#token").value=token;document.querySelector("#open").onclick=()=>{token=document.querySelector("#token").value.trim();if(token)localStorage.setItem("percho-lan-token",token);connect()}}
function render(){const active=[...views.values()].sort((a,b)=>b.agentActive-a.agentActive||b.lastActivity-a.lastActivity);if(!list.length){app.innerHTML=`<div class="empty">${L.empty}</div>`;return}const view=views.get(selected)||active[0];if(!view){app.innerHTML=`<div class="empty">${L.empty}</div>`;return}selected=view.sessionId;const rows=[...list].sort((a,b)=>Number(b.active)-Number(a.active)||b.modifiedAt-a.modifiedAt).map(item=>{const current=views.get(item.sessionId);return current?`<button data-id="${esc(item.sessionId)}" class="${item.sessionId===selected?"active":""}"><div class="name"><i class="dot ${current.agentActive?"live":""}"></i>${esc(item.name)}</div><div class="path">${esc(item.cwd)}</div></button>`:`<div class="history"><div class="name">${esc(item.name)}</div><div class="path">${esc(item.cwd)}</div></div>`}).join("");const flags=[view.agentActive?L.working:L.idle,view.compacting?L.compacting:"",view.queued?L.queued:""].filter(Boolean).join(" · ");const todos=view.todos?.map(t=>`<div class="todo ${t.status==="completed"?"done":""}">${t.status==="completed"?"✓":t.status==="in_progress"?"◌":"○"} ${esc(t.content)}</div>`).join("")||"";const s=view.stats;app.innerHTML=`<div class="wrap"><aside class="card list">${rows}</aside><section class="card">${view.pendingPermission?`<div class="banner">${L.permission}<div class="meta">${esc(view.pendingPermission.title)} · ${esc(view.pendingPermission.message)}</div></div>`:""}<div class="grid"><div><div class="label">${L.project}</div><div class="value">${esc(view.cwd)}</div></div><div><div class="label">${flags}</div><div class="value">${view.currentTool?esc(view.currentTool):"—"}</div></div></div>${todos?`<h3>${L.todos}</h3>${todos}`:""}<h3>${L.output}</h3><pre>${esc(view.assistantTail||L.noOutput)}</pre>${view.lastError?`<h3>${L.error}</h3><pre>${esc(view.lastError)}</pre>`:""}${s?`<h3>${L.stats}</h3><div class="meta">${L.input}: ${s.inputTokens} · ${L.outputTokens}: ${s.outputTokens} · ${L.cost}: $${Number(s.cost||0).toFixed(4)}</div>`:""}</section></div>`;document.querySelectorAll("[data-id]").forEach(el=>{el.onclick=()=>{selected=el.dataset.id;render()}})}
connect();
})();
</script></body></html>
