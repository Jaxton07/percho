appId: io.github.jaxton07.pi-desktop
productName: Pi Desktop
directories:
  output: dist
files:
  - out/**
  - package.json
  - "!node_modules/@pi-desktop"
asarUnpack:
  - "**/*.node"
mac:
  category: public.app-category.developer-tools
  target:
    - target: dmg
      arch: [arm64, x64]
    - target: zip
      arch: [arm64, x64]
  # 产物名与 productName 解耦：保持 pi-desktop-mac-* 兼容 README 下载表（productName 带空格仅作显示名）
  artifactName: pi-desktop-mac-${arch}.${ext}
win:
  target:
    - target: nsis
      arch: [x64]
    - target: zip
      arch: [x64]
  artifactName: pi-desktop-windows-${arch}.${ext}
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
publish:
  provider: github
  owner: Jaxton07
  repo: pi-desktop
