name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.plan.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - id: plan
        run: node scripts/release-info.mjs --ci-beta

  runtime:
    needs: prepare
    uses: ./.github/workflows/remote-runtime.yml
    with:
      release_tag: ${{ needs.prepare.outputs.tag }}

  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test

  desktop:
    needs: [prepare, runtime, check]
    uses: ./.github/workflows/desktop-package.yml
    with:
      release_tag: ${{ needs.prepare.outputs.tag }}

  release-bundle:
    needs: [prepare, desktop]
    runs-on: ubuntu-latest
    env:
      PERCHO_BUILD_RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
      PERCHO_BUILD_SOURCE_COMMIT: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          pattern: remote-runtime-*
          path: .local/release-bundle
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          path: .local/release-bundle
          merge-multiple: true
      - name: Verify complete Beta release without publishing
        run: node scripts/publish-release.mjs .local/release-bundle

  local-storage:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Verify private storage on native filesystem and ACLs
        run: npm run test -w packages/backend -- test/local-agent-storage.test.ts test/local-agent-storage-sdk.test.ts
      - name: Test private storage startup decisions
        run: npm run test -w packages/desktop -- src/main/storage-startup-controller.test.ts
