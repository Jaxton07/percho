name: Remote runtime artifacts

on:
  workflow_call:
    inputs:
      release_tag:
        type: string
        default: ""
        required: false

jobs:
  build-and-verify:
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            platform: linux/amd64
            runner: ubuntu-22.04
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-22.04-arm
    env:
      PLATFORM: ${{ matrix.platform }}
      ARTIFACT_ARCH: ${{ matrix.arch }}
      PERCHO_BUILD_RELEASE_TAG: ${{ inputs.release_tag }}
      PERCHO_BUILD_SOURCE_COMMIT: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Prepare target Linux build environment
        run: docker buildx build --load --platform "$PLATFORM" -t percho-runtime-build -f scripts/remote-runtime/Dockerfile scripts/remote-runtime
      - name: Build locked runtime with target dependencies
        run: |
          # The read-only source bind must already contain the nested tmpfs mountpoint.
          mkdir -p ".local/runtime-${ARTIFACT_ARCH}" node_modules
          docker run --rm --platform "$PLATFORM" \
            -e PERCHO_BUILD_RELEASE_TAG \
            -e PERCHO_BUILD_SOURCE_COMMIT \
            -v "$PWD:/source:ro" --tmpfs /source/node_modules \
            -v "$PWD/.local/runtime-${ARTIFACT_ARCH}:/output" \
            percho-runtime-build node /source/scripts/build-remote-runtime.mjs --out /output
      - name: Verify actual package without checkout or external network
        run: |
          docker run --rm --platform "$PLATFORM" --network none \
            --tmpfs /runtime:mode=0700,exec --tmpfs /state:mode=0700 \
            -v "$PWD/scripts:/verify:ro" \
            -v "$PWD/.local/runtime-${ARTIFACT_ARCH}:/artifacts:ro" \
            percho-runtime-build sh /verify/remote-runtime/check-artifact.sh
      - name: Verify desktop installer against the target archive
        run: |
          docker run --rm --platform "$PLATFORM" --network none \
            --tmpfs /state:mode=0700,exec \
            -v "$PWD/scripts:/verify:ro" \
            -v "$PWD/packages/backend/src/runtime/install-script.ts:/bootstrap.mjs:ro" \
            -v "$PWD/.local/runtime-${ARTIFACT_ARCH}:/artifacts:ro" \
            percho-runtime-build node /verify/verify-remote-runtime-install.mjs
      - name: Prepare Node Current compatibility environment
        run: docker buildx build --load --platform "$PLATFORM" --build-arg NODE_VERSION=26.12.1 -t percho-runtime-current -f scripts/remote-runtime/Dockerfile scripts/remote-runtime
      - name: Verify the same archive with Node Current
        run: |
          docker run --rm --platform "$PLATFORM" --network none \
            --tmpfs /runtime:mode=0700,exec --tmpfs /state:mode=0700 \
            -v "$PWD/scripts:/verify:ro" \
            -v "$PWD/.local/runtime-${ARTIFACT_ARCH}:/artifacts:ro" \
            percho-runtime-current sh /verify/remote-runtime/check-artifact.sh
          docker run --rm --platform "$PLATFORM" --network none \
            --tmpfs /state:mode=0700,exec \
            -v "$PWD/scripts:/verify:ro" \
            -v "$PWD/packages/backend/src/runtime/install-script.ts:/bootstrap.mjs:ro" \
            -v "$PWD/.local/runtime-${ARTIFACT_ARCH}:/artifacts:ro" \
            percho-runtime-current node /verify/verify-remote-runtime-install.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: remote-runtime-${{ matrix.arch }}
          include-hidden-files: true
          compression-level: 0
          path: |
            .local/runtime-${{ matrix.arch }}/percho-runtime-linux-${{ matrix.arch }}.tar.gz
            .local/runtime-${{ matrix.arch }}/runtime-linux-${{ matrix.arch }}.json
          if-no-files-found: error
